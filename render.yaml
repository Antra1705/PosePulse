# Render Blueprint for the PosePulse API.
# Dashboard → New → Blueprint → pick this repo. Secrets are entered in the UI.
services:
  - type: web
    name: posepulse
    runtime: python
    plan: free            # upgrade to "starter" for always-on + ~3× faster inference
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --ws-per-message-deflate false
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: GROQ_API_KEY
        sync: false        # set in the Render dashboard
      - key: FRONTEND_ORIGINS
        value: "*"
      - key: WEB_CONCURRENCY
        value: "1"
